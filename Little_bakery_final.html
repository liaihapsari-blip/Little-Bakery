<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Little Bakery — Kasir</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #5b9eac;
    --teal-light: #8fc4cf;
    --teal-dark: #3a7a8a;
    --cream: #fdf6ee;
    --warm: #e8956d;
    --dark: #1e2d35;
    --green: #4caf7d;
    --red: #e05c5c;
    --shadow: 0 4px 24px rgba(30,45,53,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--dark);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
  }

  header {
    background: var(--teal);
    color: white;
    padding: 16px 20px 14px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 16px rgba(91,158,172,0.35);
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-family: 'Playfair Display', serif; font-size: 1.4rem; }
  header h1 span { color: #ffd9a8; }
  .header-sub { font-size: 0.75rem; opacity: 0.75; margin-top: 2px; }
  .connected-badge {
    background: rgba(76,175,125,0.25);
    border: 1px solid rgba(76,175,125,0.5);
    border-radius: 20px; padding: 5px 12px;
    font-size: 0.75rem; color: #a8ffd4;
    display: flex; align-items: center; gap: 5px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }

  .search-wrap { padding: 14px 16px 0; }
  .search-bar {
    width: 100%; padding: 11px 16px;
    border: 2px solid transparent; border-radius: 14px;
    background: white; font-family: 'DM Sans', sans-serif;
    font-size: 0.92rem; box-shadow: var(--shadow);
    outline: none; transition: border-color 0.2s;
  }
  .search-bar:focus { border-color: var(--teal); }

  .menu-section { padding: 0 16px 140px; }
  .category-label {
    font-family: 'Playfair Display', serif;
    font-size: 1rem; font-weight: 700;
    color: var(--teal-dark);
    margin: 18px 0 10px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--teal-light);
  }
  .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .menu-item {
    background: white; border-radius: 14px;
    padding: 14px 12px; cursor: pointer;
    box-shadow: 0 2px 10px rgba(30,45,53,0.07);
    border: 2px solid transparent;
    transition: border-color 0.15s; position: relative;
  }
  .menu-item:active { transform: scale(0.96); background: #f0f8fa; }
  .menu-item.in-cart { border-color: var(--teal); }
  .item-name { font-size: 0.85rem; font-weight: 600; line-height: 1.3; padding-right: 24px; }
  .item-price { font-size: 0.8rem; color: var(--teal-dark); margin-top: 5px; font-weight: 500; }
  .item-badge {
    position: absolute; top: 9px; right: 9px;
    background: var(--teal); color: white;
    border-radius: 50%; width: 22px; height: 22px;
    font-size: 0.75rem; font-weight: 700;
    display: none; align-items: center; justify-content: center;
  }
  .menu-item.in-cart .item-badge { display: flex; }

  /* CART DRAWER */
  .cart-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px;
    background: var(--dark);
    border-radius: 20px 20px 0 0;
    max-height: 62px; overflow: hidden;
    transition: max-height 0.35s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 -4px 30px rgba(0,0,0,0.25);
    z-index: 200;
  }
  .cart-bar.open { max-height: 88vh; overflow-y: auto; }

  .cart-handle {
    padding: 16px 20px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    min-height: 62px;
  }
  .cart-handle-left { display: flex; align-items: center; gap: 10px; color: white; font-weight: 600; font-size: 0.92rem; }
  .cart-count-pill {
    background: var(--warm); color: white;
    border-radius: 50%; width: 24px; height: 24px;
    font-size: 0.78rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .cart-total-pill {
    background: rgba(255,255,255,0.1); color: white;
    border-radius: 20px; padding: 4px 12px;
    font-size: 0.82rem; font-weight: 700;
  }
  .cart-arrow { color: rgba(255,255,255,0.4); font-size: 0.9rem; transition: transform 0.3s; margin-left: 4px; }
  .cart-bar.open .cart-arrow { transform: rotate(180deg); }

  .cart-content { padding: 4px 16px 16px; }
  .cart-empty { text-align: center; padding: 28px 0; color: rgba(255,255,255,0.25); font-size: 0.85rem; }

  .cart-row {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
    color: white;
  }
  .cart-row-name { flex: 1; font-size: 0.82rem; line-height: 1.3; }
  .cart-row-price { font-size: 0.78rem; color: var(--teal-light); white-space: nowrap; }
  .qty-controls { display: flex; align-items: center; gap: 6px; }
  .qty-btn {
    width: 28px; height: 28px;
    background: rgba(255,255,255,0.1); border: none; border-radius: 8px;
    color: white; font-size: 1.1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .qty-btn:active { background: rgba(255,255,255,0.25); }
  .qty-btn.minus { background: rgba(224,92,92,0.2); color: #ff9a9a; }
  .qty-num { font-size: 0.9rem; font-weight: 700; min-width: 22px; text-align: center; color: white; }

  .cart-form { padding-top: 14px; }
  .form-input {
    width: 100%; background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
    padding: 10px 14px; font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem; color: white; outline: none; margin-bottom: 10px;
  }
  .form-input::placeholder { color: rgba(255,255,255,0.3); }
  .form-input:focus { border-color: var(--teal-light); }

  .total-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0 14px;
  }
  .total-label { color: rgba(255,255,255,0.5); font-size: 0.85rem; }
  .total-amount { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--warm); }

  .btn-submit {
    width: 100%; padding: 15px;
    background: linear-gradient(135deg, var(--teal) 0%, var(--teal-dark) 100%);
    color: white; border: none; border-radius: 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem; font-weight: 600; cursor: pointer;
  }
  .btn-submit:active { transform: scale(0.98); }
  .btn-submit:disabled { opacity: 0.5; }

  .btn-clear {
    width: 100%; margin-top: 8px; padding: 10px;
    background: transparent; border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; color: rgba(255,255,255,0.35);
    font-family: 'DM Sans', sans-serif; font-size: 0.82rem; cursor: pointer;
  }

  #toast {
    position: fixed; bottom: 76px; left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--dark); color: white;
    padding: 11px 22px; border-radius: 30px;
    font-size: 0.88rem; box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    opacity: 0; transition: all 0.3s; pointer-events: none;
    border-left: 4px solid var(--green); z-index: 9999; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { border-left-color: var(--red); }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div>
      <h1>🥐 Little <span>Bakery</span></h1>
      <div class="header-sub">Sistem Kasir — Est. 2022</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
      <div class="connected-badge">
        <div class="dot"></div> Terhubung ✓
      </div>
      <button onclick="refreshRekap()" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);border-radius:20px;padding:4px 12px;font-size:0.72rem;color:white;cursor:pointer;">🔄 Refresh Rekap</button>
      <button onclick="showLastReceipt()" id="lastReceiptBtn" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);border-radius:20px;padding:4px 12px;font-size:0.72rem;color:white;cursor:pointer;">🧾 Receipt Terakhir</button>
    </div>
  </div>
</header>

<div class="search-wrap">
  <input class="search-bar" type="search" placeholder="🔍 Cari menu..." oninput="filterMenu(this.value)" />
</div>

<div class="menu-section" id="menuContainer"></div>

<div class="cart-bar" id="cartBar">
  <div class="cart-handle" onclick="toggleCart()">
    <div class="cart-handle-left">
      🛒 <span id="handleText">Keranjang kosong</span>
      <div class="cart-count-pill" id="cartCount">0</div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;">
      <div class="cart-total-pill" id="handleTotal">Rp 0</div>
      <div class="cart-arrow">▲</div>
    </div>
  </div>

  <div class="cart-content">
    <div id="cartItems"><div class="cart-empty">Belum ada item 🍞</div></div>
    <div class="cart-form" id="cartForm" style="display:none">
      <input class="form-input" id="custName" type="text" placeholder="👤 Nama pelanggan (opsional)" />
      <input class="form-input" id="custPhone" type="tel" placeholder="📱 No HP" />
      <input class="form-input" id="custPickupDay" type="text" placeholder="📅 Hari pengambilan (misal: Senin)" />
      <input class="form-input" id="custPickupDate" type="date" placeholder="📅 Tanggal pengambilan" />
      <input class="form-input" id="custPickupTime" type="time" placeholder="⏰ Jam pengambilan" />
      <select class="form-input" id="custPayment">
        <option value="Belum Bayar">💳 Belum Bayar</option>
        <option value="DP">💰 DP</option>
        <option value="Lunas">✅ Lunas</option>
      </select>
      <input class="form-input" id="custNote" type="text" placeholder="📝 Catatan (opsional)" />
      <div class="total-bar">
        <div class="total-label">Total Pembayaran</div>
        <div class="total-amount" id="totalAmount">Rp 0</div>
      </div>
      <button class="btn-submit" id="submitBtn" onclick="submitOrder()">✅ Simpan ke Google Sheets</button>
      <button class="btn-clear" onclick="clearOrder()">🗑 Kosongkan pesanan</button>
    </div>
  </div>
</div>

<!-- RECEIPT MODAL -->
<div id="receiptModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:600;align-items:center;justify-content:center;padding:20px;">
  <div style="background:white;border-radius:20px;width:100%;max-width:360px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.4);">
    <div style="background:#5b9eac;padding:18px 20px;text-align:center;">
      <div style="font-family:'Playfair Display',serif;font-size:1.3rem;color:white;">🥐 Little Bakery</div>
      <div style="font-size:0.75rem;color:rgba(255,255,255,0.8);margin-top:2px;">Est. 2022</div>
    </div>
    <div id="receiptBody" style="padding:20px;font-family:'DM Sans',sans-serif;font-size:0.85rem;color:#1e2d35;"></div>
    <div style="padding:0 20px 20px;display:flex;flex-direction:column;gap:8px;">
      <button onclick="copyReceipt()" style="width:100%;padding:12px;background:#5b9eac;color:white;border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:0.9rem;font-weight:600;cursor:pointer;">
        📋 Copy Teks Struk
      </button>
      <button onclick="shareWhatsApp()" style="width:100%;padding:12px;background:#25D366;color:white;border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:0.9rem;font-weight:600;cursor:pointer;">
        📱 Share ke WhatsApp
      </button>
      <button onclick="closeReceipt()" style="width:100%;padding:10px;background:none;border:2px solid #e0eaed;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:0.85rem;cursor:pointer;color:#6b8a92;">
        Tutup
      </button>
    </div>
  </div>
</div>

<!-- PRICE MODAL -->
<div id="priceModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:500;align-items:center;justify-content:center;">
  <div style="background:white;border-radius:20px;padding:28px 24px;width:85%;max-width:320px;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
    <div style="font-family:'Playfair Display',serif;font-size:1.1rem;color:#1e2d35;margin-bottom:6px;" id="priceModalTitle">Foccacia S</div>
    <div style="font-size:0.82rem;color:#6b8a92;margin-bottom:16px;">Masukkan harga untuk item ini</div>
    <input id="customPriceInput" type="number" placeholder="Contoh: 75000"
      style="width:100%;padding:11px 14px;border:2px solid #e0eaed;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:1rem;outline:none;margin-bottom:14px;"
      oninput="this.style.borderColor='#5b9eac'" />
    <div style="display:flex;gap:10px;">
      <button onclick="confirmCustomPrice()" style="flex:1;padding:12px;background:#5b9eac;color:white;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:0.92rem;font-weight:600;cursor:pointer;">✅ Tambah</button>
      <button onclick="closePriceModal()" style="padding:12px 16px;background:none;border:2px solid #e0eaed;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:0.88rem;cursor:pointer;color:#6b8a92;">Batal</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzykYpmcYZ89ZY2sDLhlbhPatiK4jrUx2wlLc7UEuAfc6I13vlToJSEn6UglIHcFsqh/exec';

const MENU = [
  { category: "🍞 Rustic Bread", items: [
    { name: "Rustic Original", price: 45000 },
    { name: "Rustic Double Chocolate", price: 80000 },
    { name: "Rustic Cheese", price: 80000 },
    { name: "Rustic Choco Cheese", price: 90000 },
    { name: "Rustic Custom", price: 0, customPrice: true },
  ]},
  { category: "🌀 Soft Sourdough", items: [
    { name: "Cinnamon Roll", price: 25000 },
    { name: "Coffee Bun", price: 20000 },
    { name: "Sourdough Double Choco", price: 20000 },
    { name: "Cranberry Cheese", price: 20000 },
    { name: "Matcha Cheese", price: 20000 },
    { name: "Milky Cheese", price: 25000 },
    { name: "Blueberry Bun", price: 20000 },
    { name: "Raspberry Bun", price: 20000 },
    { name: "Smoked Beef", price: 20000 },
    { name: "Garlic Bread", price: 18000 },
  ]},
  { category: "🍕 Other Breads", items: [
    { name: "Pizza Bread", price: 85000 },
    { name: "Foccacia", price: 0, customPrice: true },
  ]},
  { category: "🧂 Salt Bread", items: [
    { name: "Salt Ori Butter", price: 15000 },
    { name: "Salt Choco Butter", price: 15000 },
    { name: "Salt Coffee Bun", price: 20000 },
    { name: "Salt Ori Cream Cheese", price: 20000 },
    { name: "Salt Ori Choco", price: 20000 },
    { name: "Salt Ori Peperoni", price: 20000 },
    { name: "Salt Ori Garlic", price: 20000 },
    { name: "Salt Ori Choco Cheese", price: 22500 },
    { name: "Salt Choco Cream Cheese", price: 20000 },
    { name: "Salt Choco Choco", price: 20000 },
  ]},
];

let order = [];
let cartOpen = false;

function renderMenu(data) {
  const c = document.getElementById('menuContainer');
  c.innerHTML = '';
  data.forEach(cat => {
    if (!cat.items.length) return;
    const lbl = document.createElement('div');
    lbl.className = 'category-label';
    lbl.textContent = cat.category;
    c.appendChild(lbl);
    const grid = document.createElement('div');
    grid.className = 'menu-grid';
    cat.items.forEach(item => {
      const key = item.name.replace(/\s+/g,'_');
      const el = document.createElement('div');
      el.className = 'menu-item';
      el.id = 'mi_' + key;
      el.innerHTML = `
        <div class="item-badge" id="badge_${key}">0</div>
        <div class="item-name">${item.name}</div>
        <div class="item-price">${item.customPrice ? '📝 Harga custom' : 'Rp ' + item.price.toLocaleString('id-ID')}</div>
      `;
      el.onclick = () => addItem(item);
      grid.appendChild(el);
    });
    c.appendChild(grid);
  });
  refreshBadges();
}

function filterMenu(q) {
  if (!q.trim()) { renderMenu(MENU); return; }
  const f = MENU.map(cat => ({ ...cat, items: cat.items.filter(i => i.name.toLowerCase().includes(q.toLowerCase())) }));
  renderMenu(f);
}

function refreshBadges() {
  order.forEach(o => {
    const key = o.name.replace(/\s+/g,'_');
    const mi = document.getElementById('mi_' + key);
    const badge = document.getElementById('badge_' + key);
    if (mi) mi.classList.toggle('in-cart', o.qty > 0);
    if (badge) badge.textContent = o.qty;
  });
}

let lastReceiptText = '';

function showReceipt(nama, hp, hari, tglAmbil, bayar, catatan, orderSnapshot) {
  const total = orderSnapshot.reduce((s, o) => s + o.price * o.qty, 0);
  const tglFormatted = tglAmbil !== '-' ? tglAmbil : '';
  const ambil = [hari, tglFormatted].filter(x => x && x !== '-').join(', ');

  // Build receipt text
  let lines = [];
  lines.push('🥐 *Little Bakery*');
  lines.push('─────────────────');
  if (nama && nama !== '-') lines.push(`👤 Nama  : ${nama}`);
  if (hp && hp !== '-') lines.push(`📱 No HP : ${hp}`);
  if (ambil) lines.push(`📅 Ambil : ${ambil}`);
  lines.push('─────────────────');
  orderSnapshot.forEach(o => {
    const subtotal = o.price * o.qty;
    lines.push(`${o.name} x${o.qty}  →  Rp ${subtotal.toLocaleString('id-ID')}`);
  });
  lines.push('─────────────────');
  lines.push(`💰 Total  : Rp ${total.toLocaleString('id-ID')}`);
  lines.push(`💳 Status : ${bayar}`);
  if (catatan && catatan !== '-') lines.push(`📝 Catatan: ${catatan}`);
  lines.push('─────────────────');
  lines.push('🏦 *Pembayaran Transfer:*');
  lines.push('BCA      : 0500464453');
  lines.push('Mandiri  : 1420019708279');
  lines.push('A/n Lia Indri Hapsari');
  lines.push('─────────────────');
  lines.push('Terima kasih! 🙏');

  lastReceiptText = lines.join('\n');

  // Build HTML receipt
  let html = '';
  if (nama && nama !== '-') html += `<div style="margin-bottom:4px;"><b>👤 Nama</b>: ${nama}</div>`;
  if (hp && hp !== '-') html += `<div style="margin-bottom:4px;"><b>📱 No HP</b>: ${hp}</div>`;
  if (ambil) html += `<div style="margin-bottom:12px;"><b>📅 Ambil</b>: ${ambil}</div>`;
  html += `<div style="border-top:1px dashed #ccc;padding-top:12px;margin-bottom:12px;">`;
  orderSnapshot.forEach(o => {
    const subtotal = o.price * o.qty;
    html += `<div style="display:flex;justify-content:space-between;margin-bottom:6px;">
      <span>${o.name} x${o.qty}</span>
      <span style="font-weight:600;">Rp ${subtotal.toLocaleString('id-ID')}</span>
    </div>`;
  });
  html += `</div>`;
  html += `<div style="border-top:2px solid #5b9eac;padding-top:12px;">`;
  html += `<div style="display:flex;justify-content:space-between;font-size:1.05rem;">
    <span style="font-weight:700;">Total</span>
    <span style="font-weight:700;color:#e8956d;">Rp ${total.toLocaleString('id-ID')}</span>
  </div>`;
  const bayarColor = bayar === 'Lunas' ? '#4caf7d' : bayar === 'DP' ? '#f0a500' : '#e05c5c';
  html += `<div style="display:flex;justify-content:space-between;margin-top:6px;">
    <span>Status Bayar</span>
    <span style="font-weight:600;color:${bayarColor};">${bayar}</span>
  </div>`;
  if (catatan && catatan !== '-') {
    html += `<div style="margin-top:6px;"><span>Catatan: </span><span style="color:#6b8a92;">${catatan}</span></div>`;
  }
  html += `</div>`;
  html += `<div style="margin-top:14px;padding:12px;background:#f0f8fa;border-radius:10px;font-size:0.82rem;">
    <div style="font-weight:700;margin-bottom:6px;">🏦 Transfer ke:</div>
    <div>BCA &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;: <b>0500464453</b></div>
    <div>Mandiri : <b>1420019708279</b></div>
    <div style="color:#6b8a92;margin-top:4px;">A/n Lia Indri Hapsari</div>
  </div>`;
  html += `<div style="text-align:center;margin-top:16px;color:#6b8a92;font-size:0.8rem;">Terima kasih! 🙏</div>`;

  document.getElementById('receiptBody').innerHTML = html;
  document.getElementById('receiptModal').style.display = 'flex';
}

function showLastReceipt() {
  if (!lastReceiptText) {
    showToast('Belum ada receipt. Simpan pesanan dulu!', true);
    return;
  }
  document.getElementById('receiptModal').style.display = 'flex';
}

function closeReceipt() {
  document.getElementById('receiptModal').style.display = 'none';
}

function copyReceipt() {
  navigator.clipboard.writeText(lastReceiptText).then(() => {
    showToast('📋 Teks struk berhasil di-copy!');
  }).catch(() => {
    // Fallback untuk browser yang tidak support clipboard API
    const el = document.createElement('textarea');
    el.value = lastReceiptText;
    el.style.position = 'fixed';
    el.style.opacity = '0';
    document.body.appendChild(el);
    el.focus();
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    showToast('📋 Teks struk berhasil di-copy!');
  });
}

function shareWhatsApp() {
  const encoded = encodeURIComponent(lastReceiptText);
  window.location.href = 'whatsapp://send?text=' + encoded;
}

function addItem(item) {
  if (item.customPrice) {
    pendingCustomItem = item;
    document.getElementById('priceModalTitle').textContent = item.name;
    document.getElementById('customPriceInput').value = '';
    const modal = document.getElementById('priceModal');
    modal.style.display = 'flex';
    setTimeout(() => document.getElementById('customPriceInput').focus(), 100);
    return;
  }
  const ex = order.find(o => o.name === item.name);
  if (ex) ex.qty++;
  else order.push({ ...item, qty: 1 });
  updateCart(); refreshBadges();
  showToast('✅ ' + item.name);
}

function confirmCustomPrice() {
  const val = parseInt(document.getElementById('customPriceInput').value);
  if (!val || val <= 0) {
    document.getElementById('customPriceInput').style.borderColor = '#e05c5c';
    return;
  }
  const item = { ...pendingCustomItem, price: val };
  const ex = order.find(o => o.name === item.name && o.price === val);
  if (ex) ex.qty++;
  else order.push({ ...item, qty: 1 });
  closePriceModal();
  updateCart(); refreshBadges();
  showToast('✅ ' + item.name + ' Rp ' + val.toLocaleString('id-ID'));
}

function closePriceModal() {
  document.getElementById('priceModal').style.display = 'none';
  pendingCustomItem = null;
}

function changeQty(name, delta) {
  const idx = order.findIndex(o => o.name === name);
  if (idx === -1) return;
  order[idx].qty += delta;
  if (order[idx].qty <= 0) order.splice(idx, 1);
  updateCart(); refreshBadges();
}

function clearOrder() {
  order = [];
  document.getElementById('custName').value = '';
  document.getElementById('custPhone').value = '';
  document.getElementById('custPickupDay').value = '';
  document.getElementById('custPickupDate').value = '';
  document.getElementById('custPickupTime').value = '';
  document.getElementById('custPayment').selectedIndex = 0;
  document.getElementById('custNote').value = '';
  updateCart();
  // Re-render menu setelah order kosong supaya semua badge reset
  const c = document.getElementById('menuContainer');
  c.querySelectorAll('.menu-item').forEach(el => {
    el.classList.remove('in-cart');
    const badge = el.querySelector('.item-badge');
    if (badge) badge.textContent = '0';
  });
}

function updateCart() {
  const total = order.reduce((s, o) => s + o.price * o.qty, 0);
  const count = order.reduce((s, o) => s + o.qty, 0);
  document.getElementById('cartCount').textContent = count;
  document.getElementById('handleTotal').textContent = `Rp ${total.toLocaleString('id-ID')}`;
  document.getElementById('handleText').textContent = count ? `${count} item dipilih` : 'Keranjang kosong';
  document.getElementById('totalAmount').textContent = `Rp ${total.toLocaleString('id-ID')}`;

  const itemsEl = document.getElementById('cartItems');
  const formEl  = document.getElementById('cartForm');
  if (!order.length) {
    itemsEl.innerHTML = '<div class="cart-empty">Belum ada item 🍞</div>';
    formEl.style.display = 'none';
    return;
  }
  formEl.style.display = 'block';
  itemsEl.innerHTML = order.map(o => `
    <div class="cart-row">
      <div class="cart-row-name">${o.name}</div>
      <div class="qty-controls">
        <button class="qty-btn minus" onclick="changeQty('${o.name.replace(/'/g,"\\'")}', -1)">−</button>
        <span class="qty-num">${o.qty}</span>
        <button class="qty-btn" onclick="changeQty('${o.name.replace(/'/g,"\\'")}', 1)">+</button>
      </div>
      <div class="cart-row-price">Rp ${(o.price * o.qty).toLocaleString('id-ID')}</div>
    </div>
  `).join('');
}

function toggleCart() {
  cartOpen = !cartOpen;
  document.getElementById('cartBar').classList.toggle('open', cartOpen);
}

async function submitOrder() {
  if (!order.length) { showToast('❌ Pesanan masih kosong!', true); return; }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Menyimpan...';

  const payload = {
    nama:      document.getElementById('custName').value || '-',
    hp:        document.getElementById('custPhone').value || '-',
    hari:      document.getElementById('custPickupDay').value || '-',
    tgl_ambil: document.getElementById('custPickupDate').value || '-',
    jam_ambil: document.getElementById('custPickupTime').value || '-',
    bayar:     document.getElementById('custPayment').value,
    items:     order.map(o => `${o.name}|${o.qty}|${o.price}`).join(','),
    catatan:   document.getElementById('custNote').value || '-',
  };

  const params = new URLSearchParams({
    nama:      payload.nama,
    hp:        payload.hp,
    hari:      payload.hari,
    tgl_ambil: payload.tgl_ambil,
    jam_ambil: payload.jam_ambil,
    bayar:     payload.bayar,
    items:     payload.items,
    catatan:   payload.catatan
  });

  // Simpan snapshot sebelum clear
  const orderSnapshot = [...order];
  const nama    = payload.nama;
  const hp      = payload.hp;
  const hari    = payload.hari;
  const tgl     = payload.tgl_ambil;
  const bayar   = payload.bayar;
  const catatan = payload.catatan;

  // Tampilkan receipt dulu
  showReceipt(nama, hp, hari, tgl, bayar, catatan, orderSnapshot);

  clearOrder();
  cartOpen = false;
  document.getElementById('cartBar').classList.remove('open');
  btn.disabled = false;
  btn.textContent = '✅ Simpan ke Google Sheets';

  // Buka tab Google Sheets setelah 1 detik
  setTimeout(function() {
    const url = SCRIPT_URL + '?' + params.toString();
    window.open(url, '_blank');
  }, 1000);
}

function refreshRekap() {
  const url = SCRIPT_URL + '?action=refresh';
  window.open(url, '_blank');
  showToast('🔄 Rekap diperbarui! Tutup tab yang terbuka.');
}

function showToast(msg, err = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = err ? 'error' : '';
  void t.offsetWidth;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

renderMenu(MENU);
</script>
